<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تذكرة الخروج – ابنِ برج دبي</title>
<style>
:root{--bg:#e8f4ff;--card:#fff;--ink:#22324a;--soft:#f1f6fc;--blue:#2e9be6;--green:#2fb36d;--red:#e5524f;--gold:#ffc83d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12203a;--card:#1d2f50;--ink:#f1f6ff;--soft:#263c63}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:12px;display:flex;justify-content:center}
#app{width:100%;max-width:900px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.top h1{margin:0;font-size:22px;flex:1}
.time{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--card);border-radius:16px;padding:2px 16px;min-width:130px;text-align:center}
.time.low{color:var(--red);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.bar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transform-origin:right;transition:transform 1s linear}
.main{display:grid;grid-template-columns:230px 1fr;gap:12px}
@media (max-width:640px){.main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 20px rgba(30,70,120,.15)}
.tower{display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;min-height:340px;position:relative;background:linear-gradient(#bfe3ff,#fff4d6);border-radius:22px;overflow:hidden;padding-bottom:0}
@media (max-width:640px){.tower{min-height:150px;flex-direction:row-reverse;align-items:flex-end;justify-content:center;padding:0 10px}}
.sandy{position:absolute;bottom:0;left:0;right:0;height:26px;background:#e8c27a}
.floor{width:100px;height:26px;margin-top:2px;border-radius:5px;background:linear-gradient(90deg,#4aa8f0,#8fd0ff);border:2px solid #2677b8;animation:drop .45s ease-out;z-index:1;display:flex;align-items:center;justify-content:center;font-size:13px}
@media (max-width:640px){.floor{width:26px;height:80px;margin:0 2px 26px;}}
@keyframes drop{from{transform:translateY(-80px);opacity:0}to{transform:none;opacity:1}}
.cnt{position:absolute;top:8px;right:10px;font-weight:700;background:var(--card);border-radius:12px;padding:2px 10px;z-index:2}
.em{font-size:54px;text-align:center}
.q{font-size:26px;font-weight:700;text-align:center;line-height:1.7;margin:4px 0 14px}
.opt{display:block;width:100%;font:inherit;font-size:24px;font-weight:600;color:var(--ink);background:var(--soft);border:3px solid transparent;border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer}
.opt:active{transform:scale(.97)}
.opt.ok{background:#c9f3dc;border-color:var(--green)}
.opt.no{background:#ffd9d8;border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btn{display:block;width:100%;font:inherit;font-size:26px;font-weight:800;color:#fff;background:var(--blue);border:0;border-radius:18px;padding:14px;cursor:pointer;box-shadow:0 5px 0 #1c75b3}
.btn.g{background:var(--green);box-shadow:0 5px 0 #1f8450}
.msg{text-align:center;font-size:22px;margin:8px 0 14px;line-height:1.7}
.big{font-size:70px;text-align:center}
.note{font-size:16px;text-align:center;margin-top:8px;opacity:.8}
.conf{position:fixed;top:-40px;font-size:30px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><h1>🏙️ تذكرة الخروج: ابنِ برج دبي</h1><button id="snd" class="opt" style="width:auto;margin:0;padding:6px 12px;font-size:20px">🔊</button><div class="time" id="time">3:00</div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="main">
    <div class="tower" id="tower"><div class="sandy"></div><div class="cnt" id="cnt">0 / 10</div></div>
    <div class="card" id="stage"></div>
  </div>
</div>
<script>
const Q=[
 {e:"🏙️",q:"أُحِبُّ مَدِينَةَ دُبَيّ لِأَنَّهَا ........",o:["جَمِيلَة","قَبِيحَة","مُزْعِجَة"]},
 {e:"🗼",q:"مِنْ مَعَالِمِ دُبَيّ ........",o:["الْأَهْرَامَات","بُرْجُ خَلِيفَة","بُرْجُ إِيفِل"]},
 {e:"🧹",q:"دُبَيُّ مَدِينَةٌ آمِنَةٌ وَ ........",o:["نَظِيفَة","مُتَّسِخَة","خَطِرَة"]},
 {e:"💭",q:"أَيُّ جُمْلَةٍ تُعَبِّرُ عَنِ الرَّأْيِ؟",o:["دُبَيُّ فِي الْإِمَارَات","فِي رَأْيِي، دُبَيُّ جَمِيلَة","هُنَاكَ مَعَالِمُ كَثِيرَة"]},
 {e:"🏛️",q:"مِنْ مَعَالِمِ دُبَيّ ........",o:["بُرْجُ الْعَرَب","بُرْجُ بِيزَا","قَصْرُ بَاكِنْغْهَام"]},
 {e:"✍️",q:"مَاذَا نَضَعُ فِي نِهَايَةِ الْجُمْلَةِ؟",o:["( ؟ )","( ! )","( . )"]},
 {e:"👋",q:"تَنْتَهِي الْفِقْرَةُ بِـ ........",o:["مَرْحَبًا","شُكْرًا لَكُمْ","أَنَا حَمْدَان"]},
 {e:"👥",q:"أَعْتَقِدُ أَنَّ كُلَّ ........ تُحِبُّ زِيَارَةَ دُبَيّ.",o:["النَّاس","الْكُرْسِي","الْبَيْت"]},
 {e:"🌆",q:"فِي الْفِقْرَةِ نَكْتُبُ ثَلَاثَ ........ عَنْ دُبَيّ.",o:["أَلْوَانٍ","صِفَاتٍ","أَلْعَابٍ"]},
 {e:"🗣️",q:"أَكْمِلْ: ........ رَأْيِي، دُبَيُّ مَدِينَةٌ رَائِعَة.",o:["فِي","مِنْ","إِلَى"]}
];
const ans=[0,1,0,1,0,2,1,0,1,0];
const TOTAL=180;
const $=id=>document.getElementById(id);
let left,tm,i,built,mute=false,ac;
function beep(f,d){if(mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
$("snd").onclick=()=>{mute=!mute;$("snd").textContent=mute?"🔇":"🔊"};
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function start(){
  document.querySelectorAll(".floor").forEach(f=>f.remove());
  i=0;built=0;left=TOTAL;$("cnt").textContent="0 / 10";
  $("time").textContent=fmt(left);$("time").classList.remove("low");
  $("bar").style.transition="none";$("bar").style.transform="scaleX(1)";
  clearInterval(tm);
  tm=setInterval(()=>{left--;$("time").textContent=fmt(left);
    $("bar").style.transition="transform 1s linear";$("bar").style.transform="scaleX("+(left/TOTAL)+")";
    if(left<=30)$("time").classList.add("low");
    if(left<=0){end(true)}},1000);
  show();
}
function intro(){
  $("stage").innerHTML=`<div class="big">🏗️</div><p class="q">أَجِبْ بِسُرْعَةٍ وَابْنِ بُرْجَ دُبَيّ!</p><p class="msg">كُلُّ إِجَابَةٍ صَحِيحَةٍ = طَابِقٌ جَدِيدٌ 🧱<br>عِنْدَكَ ٣ دَقَائِقَ فَقَطْ ⏱️</p><button class="btn g" id="go">ابْدَأْ ▶</button><p class="note">إِذَا أَخْطَأْتَ جَرِّبْ مَرَّةً أُخْرَى</p>`;
  $("go").onclick=start;
}
function show(){
  const d=Q[i],c=d.o[ans[i]];
  const opts=d.o.map(t=>t).sort(()=>Math.random()-.5);
  $("stage").innerHTML=`<div class="em">${d.e}</div><p class="q">${d.q}</p>`+opts.map(t=>`<button class="opt">${t}</button>`).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b,b.textContent===c));
}
function pick(b,ok){
  if(ok){
    document.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("ok");beep(660,.15);
    built++;$("cnt").textContent=built+" / 10";
    const f=document.createElement("div");f.className="floor";f.textContent=built===10?"🇦🇪":"";
    const w=100-built*3;f.style.width=(window.innerWidth>640?w:26)+"px";$("tower").appendChild(f);
    setTimeout(()=>{i++;if(i>=Q.length)end(false);else show();},650);
  }else{b.classList.add("no");b.disabled=true;beep(200,.25);}
}
function end(timeUp){
  clearInterval(tm);
  const stars=built>=9?"⭐⭐⭐":built>=6?"⭐⭐":built>=3?"⭐":"";
  const m=built===10?"أَنْتَ مُهَنْدِسُ دُبَيّ! 🏆":built>=6?"عَمَلٌ رَائِعٌ! 👏":"جَيِّد! حَاوِلْ مَرَّةً أُخْرَى 🌱";
  $("stage").innerHTML=`<div class="big">${built===10?"🏆":"🏗️"}</div><p class="q">${timeUp?"انْتَهَى الْوَقْتُ ⏰":"أَنْهَيْتَ التَّحَدِّي!"}</p><p class="msg">بَنَيْتَ ${built} مِنْ 10 طَوَابِقَ<br>${stars}<br>${m}</p><button class="btn" id="again">الْعَبْ مَرَّةً أُخْرَى 🔄</button>`;
  $("again").onclick=()=>{intro();$("time").textContent="3:00";$("bar").style.transition="none";$("bar").style.transform="scaleX(1)";document.querySelectorAll(".floor").forEach(f=>f.remove());$("cnt").textContent="0 / 10"};
  if(built>=6)for(let n=0;n<28;n++){const c=document.createElement("div");c.className="conf";c.textContent=["🎉","⭐","🏙️","🎈"][n%4];c.style.left=Math.random()*100+"vw";c.style.animationDuration=(2+Math.random()*2)+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),4500);}
}
intro();
</script>
</body>
</html>
